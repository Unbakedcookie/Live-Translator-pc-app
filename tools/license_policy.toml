# T010 — license allow-list for everything shipped (spec §10.1, §11; DATA_TRACKER D-022).
# Anything not listed here fails the gate. GPL/AGPL and non-commercial licenses are never allowed.

allowed = [
    "MIT", "MIT-0", "MIT-CMU", "0BSD", "BSD", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Apache-2.0", "PSF-2.0", "Python-2.0", "MPL-2.0", "Unlicense", "HPND",
    "OFL-1.1", "CC0-1.0", "CC-BY-4.0",
]

# LGPL is accepted only for these packages (Qt for Python, dynamically linked; D-021).
lgpl_ids = ["LGPL-3.0", "LGPL-3.0-only", "LGPL-3.0-or-later"]
lgpl_packages = ["pyside6-essentials", "shiboken6"]

# Trove classifier / free-text names → SPDX ids.
[aliases]
"MIT License" = "MIT"
"MIT No Attribution License (MIT-0)" = "MIT-0"
"BSD License" = "BSD"
"BSD-2-Clause License" = "BSD-2-Clause"
"BSD-3-Clause License" = "BSD-3-Clause"
"Apache Software License" = "Apache-2.0"
"Apache License 2.0" = "Apache-2.0"
"Apache 2.0" = "Apache-2.0"
"Apache-2" = "Apache-2.0"
"ISC License (ISCL)" = "ISC"
"Python Software Foundation License" = "PSF-2.0"
"Mozilla Public License 2.0 (MPL 2.0)" = "MPL-2.0"
"The Unlicense (Unlicense)" = "Unlicense"
"zlib/libpng License" = "Zlib"
"Historical Permission Notice and Disclaimer (HPND)" = "HPND"
"SIL Open Font License 1.1 (OFL-1.1)" = "OFL-1.1"
"CC0 1.0 Universal (CC0 1.0) Public Domain Dedication" = "CC0-1.0"
"GNU Lesser General Public License v3 (LGPLv3)" = "LGPL-3.0"
"GNU Lesser General Public License v3 or later (LGPLv3+)" = "LGPL-3.0-or-later"
"GNU General Public License v2 (GPLv2)" = "GPL-2.0"
"GNU General Public License v3 (GPLv3)" = "GPL-3.0"
"GNU Affero General Public License v3" = "AGPL-3.0"

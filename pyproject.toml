# T010/T011 — tool configuration (spec §10.1). The app runs from the repo with
# `python -m livetranslator`; packaging (PyInstaller) is post-MVP, so there is no [project] table.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.bandit]
exclude_dirs = [".venv"]

[tool.bandit.assert_used]
# pytest relies on assert; tests are never shipped.
skips = ["*/test_*.py", "*/conftest.py"]

[tool.pyright]
include = ["livetranslator", "tools", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.12"
pythonPlatform = "Windows"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
strict = ["tools", "livetranslator/core", "livetranslator/theme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
